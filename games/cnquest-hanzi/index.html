<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="汉字大冒险 CnQuest：一款 HTML5 拼音识字小游戏，适合学前及小学低年级，边玩边学 3500 个常用汉字与拼音。" />
  <meta name="theme-color" content="#2e294e" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%232e294e%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2246%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23f4d35e%22%20font-family%3D%22serif%22%3E%E6%B1%89%3C%2Ftext%3E%3C%2Fsvg%3E" />
  <title>汉字大冒险 | CnQuest - 拼音识字小游戏</title>
  <style>
    /* 手机竖屏优先，黑底居中，禁掉选中和缩放 */
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%;
      height: 100%;
      height: 100dvh;              /* dvh 才不会被手机地址栏顶掉底部 */
      background: #1b1a26;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
      touch-action: none;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }
    #game-container {
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding-bottom: env(safe-area-inset-bottom, 0px);   /* 躲一下 iOS 手势条 */
    }
    /* 别让 flex 压扁画布。居中交给 CSS，Phaser 那边配的 NO_CENTER，两边都居中会偏 */
    canvas { display: block; flex: none; box-shadow: 0 0 40px rgba(0,0,0,.5); }

    /* Phaser 起来之前的加载页，不然先是一片白 */
    #preloader {
      position: fixed; left: 0; top: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #2e294e; color: #f4d35e; z-index: 10;
    }
    #preloader .title { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
    #preloader .sub { margin-top: 10px; font-size: 14px; color: #cfc9e6; }
    #preloader .dot { margin-top: 16px; width: 12px; height: 12px; border-radius: 50%; background: #f4d35e; animation: pulse 1s infinite ease-in-out; }
    @keyframes pulse { 0%,100% { transform: scale(.6); opacity: .4; } 50% { transform: scale(1); opacity: 1; } }
  </style>

  <!--
    GD 的广告 SDK。上广告的时候取消注释，必须放在游戏脚本前面。
    然后把 js/adUtil.js 里那两个空函数换成 gdsdk.showAd('rewarded' / 'interstitial')

    <script src="https://html5.api.gamedistribution.com/main.min.js"></script>
  -->
</head>
<body>
  <div id="game-container"></div>

  <!-- 加载页，Phaser 接手后自己会删 -->
  <div id="preloader">
    <div class="title">CnQuest</div>
    <div class="sub">Hanzi Adventure</div>
    <div class="dot"></div>
  </div>

  <!-- 本地 Phaser，万一没加载出来再退回 CDN -->
  <script src="js/vendor/phaser.min.js"></script>
  <script>
    if (typeof Phaser === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"><\/script>');
    }
  </script>

  <!-- 顺序就是依赖顺序，全是全局变量，没上模块化 -->
  <script src="js/storageUtil.js"></script>
  <script src="js/adUtil.js"></script>
  <script src="js/audioUtil.js"></script>
  <script src="js/Boot.js"></script>
  <script src="js/questionGen.js"></script>
  <script src="js/WorldMap.js"></script>
  <script src="js/GameLevel.js"></script>
  <script src="js/CardCollection.js"></script>
  <script src="js/PinyinLab.js"></script>
  <script src="js/Achievements.js"></script>
  <script src="js/GameOver.js"></script>
  <script src="js/main.js"></script>
  <script>
    window.addEventListener('load', function () {
      var p = document.getElementById('preloader');
      if (p && p.parentNode) p.parentNode.removeChild(p);
    });

    // iOS 和 Chrome 要"先有用户手势"才肯出声。不在这解锁的话，第一次答题的读音
    // 会憋到下一个手势才响，听感就是"点了没声，翻页了才突然读出来"。
    // 所以第一次触摸就播段静音 wav，把播放通路走通。
    (function () {
      var fired = false;
      function once() {
        if (fired) return;
        fired = true;
        try { if (window.AudioUtil) AudioUtil.unlock(); } catch (e) { }
        window.removeEventListener('pointerdown', once, true);
        window.removeEventListener('touchstart', once, true);
        window.removeEventListener('mousedown', once, true);
        window.removeEventListener('keydown', once, true);
      }
      // capture=true，抢在 Phaser 的 canvas 监听前面跑，保证第一次点击就已解锁
      window.addEventListener('pointerdown', once, true);
      window.addEventListener('touchstart', once, true);
      window.addEventListener('mousedown', once, true);
      window.addEventListener('keydown', once, true);
    })();
  </script>
</body>
</html>
