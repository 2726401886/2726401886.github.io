<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>效率盒子 · 数据统计后台</title>
  <style>
    :root{--primary:#4f46e5;--primary-dark:#4338ca;--bg:#f8fafc;--card:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:32px 16px}
    .wrap{max-width:760px;margin:0 auto}
    h1{font-size:22px;margin-bottom:6px}
    .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
    .gate{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px;text-align:center}
    .gate input{padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;width:240px;margin-right:8px}
    .gate button{padding:10px 20px;border:0;background:var(--primary);color:#fff;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
    .err{color:#ef4444;font-size:13px;margin-top:10px;min-height:18px}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:18px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
    .card .n{font-size:26px;font-weight:700;color:var(--primary-dark)}
    .card .l{font-size:13px;color:var(--muted);margin-top:4px}
    table{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;border-collapse:collapse;overflow:hidden}
    th,td{padding:10px 14px;text-align:left;font-size:13px;border-bottom:1px solid var(--border)}
    th{background:#f1f5f9;color:var(--muted)}
    .hidden{display:none}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>效率盒子 · 数据统计后台</h1>
    <div class="sub">后端统计由 Cloudflare Workers + D1 提供</div>

    <div id="gate" class="gate">
      <div><input id="pw" type="password" placeholder="请输入查看密码" autofocus>
      <button onclick="unlock()">查看</button></div>
      <div id="err" class="err"></div>
    </div>

    <div id="panel" class="hidden">
      <div class="grid">
        <div class="card"><div class="n" id="k_pageview">–</div><div class="l">页面访问累计</div></div>
        <div class="card"><div class="n" id="k_tool">–</div><div class="l">工具使用累计</div></div>
        <div class="card"><div class="n" id="k_reward">–</div><div class="l">打赏点击累计</div></div>
        <div class="card"><div class="n" id="k_unlock">–</div><div class="l">解锁使用累计</div></div>
      </div>
      <div class="card" style="margin-bottom:18px">
        <div class="l" style="margin-bottom:8px">最近 24 小时页面访问</div>
        <div class="n" id="pv24" style="font-size:22px">–</div>
      </div>
      <div class="l" style="margin-bottom:8px">工具使用排行 Top</div>
      <table>
        <thead><tr><th>工具</th><th>使用次数</th></tr></thead>
        <tbody id="toolRows"><tr><td colspan="2">加载中…</td></tr></tbody>
      </table>
    </div>
  </div>

  <script>
    // 后端 API 地址（部署后替换）
    window.EFFBOX_STATS_API = "https://effbox-stats.2726401886.workers.dev";

    // 查看密码：SHA-256(你的密码) 小写十六进制。默认密码 effbox2026
    const PASS_HASH = "42c9d94f9463fced935ec196188f032fe3e80b1f6a3807c335ebfdd949a73ce5"; // SHA-256("effbox2026")

    async function sha256(s){
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
      return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,"0")).join("");
    }
    async function unlock(){
      const v = document.getElementById("pw").value;
      const h = await sha256(v);
      if(h === PASS_HASH){
        document.getElementById("gate").classList.add("hidden");
        document.getElementById("panel").classList.remove("hidden");
        load();
      } else {
        document.getElementById("err").textContent = "密码错误";
      }
    }
    async function load(){
      try{
        const r = await fetch(window.EFFBOX_STATS_API + "/stats");
        const d = await r.json();
        const t = d.total || {};
        document.getElementById("k_pageview").textContent = t.pageview||0;
        document.getElementById("k_tool").textContent = t.tool_use||0;
        document.getElementById("k_reward").textContent = t.reward||0;
        document.getElementById("k_unlock").textContent = t.unlock||0;
        document.getElementById("pv24").textContent = d.pageview24h||0;
        const rows = (d.topTools||[]).map(x=>`<tr><td>${x.name}</td><td>${x.c}</td></tr>`).join("");
        document.getElementById("toolRows").innerHTML = rows || '<tr><td colspan="2">暂无数据</td></tr>';
      }catch(e){
        document.getElementById("toolRows").innerHTML = '<tr><td colspan="2">加载失败：'+e.message+'</td></tr>';
      }
    }
  </script>
</body>
</html>
