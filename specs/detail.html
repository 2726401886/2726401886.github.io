<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>规范详情 - 价格鉴证评估技术专栏</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .detail-bar{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--bg-darker,#0f0e0d);color:#fff}
    .detail-bar a.home{color:#fff;text-decoration:none;font-weight:600;font-size:14px}
    .detail-bar .spacer{flex:1}
    .detail-bar .auth-link{color:#fcd34d;text-decoration:none;font-size:13px;margin-left:10px}
    .detail-bar .auth-user{font-size:13px;color:#e7e5e4}
    #specFrame{width:100%;border:none;display:block;min-height:600px;background:#f8fafc}
    .detail-loading{padding:60px 20px;text-align:center;color:var(--text-light)}
    .detail-error{padding:40px 20px;text-align:center;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:var(--radius);max-width:680px;margin:40px auto}
    .detail-error a{color:var(--primary);text-decoration:underline}
    .debug-info{max-width:680px;margin:20px auto;padding:12px 16px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:var(--radius);font-size:12px;color:#64748b;font-family:monospace;white-space:pre-wrap;word-break:break-all}
    .version-mark{position:fixed;bottom:4px;right:4px;font-size:10px;color:#94a3b8;opacity:.6;pointer-events:none;z-index:9999}
    .fallback-panel{max-width:680px;margin:40px auto;padding:24px;background:#fff;border:1px solid #e2e8f0;border-radius:var(--radius);text-align:center}
    .fallback-panel h3{margin:0 0 12px;font-size:18px;color:#1e293b}
    .fallback-panel p{margin:0 0 16px;color:#64748b;font-size:14px;line-height:1.6}
    .fallback-panel .btn{display:inline-block;padding:10px 20px;background:var(--primary);color:#fff;border-radius:var(--radius);text-decoration:none;font-size:14px;margin:4px}
    .fallback-panel .btn.secondary{background:#f1f5f9;color:#334155;border:1px solid #cbd5e1}
  </style>
</head>
<body>
  <div class="version-mark" id="versionMark">v2026-08-13e</div>
  <header class="site-header">
    <div class="header-inner">
      <a href="../index.html" class="logo"><span class="logo-icon">E</span><span>效率盒子</span></a>
      <nav><ul class="nav-links" id="detailNav"></ul></nav>
      <div id="authBar" style="margin-left:auto"></div>
    </div>
  </header>

  <main class="main-content" style="padding:0">
    <div class="detail-loading" id="detailLoading">正在加载规范内容…</div>
    <div class="detail-error" id="detailError" style="display:none"></div>
    <div class="debug-info" id="debugInfo" style="display:none"></div>
    <div class="fallback-panel" id="fallbackPanel" style="display:none">
      <h3>规范正文加载失败</h3>
      <p>当前浏览器无法在当前页面内渲染该规范。你可以选择在新标签页中打开，或者联系管理员。</p>
      <a id="openNewTabBtn" class="btn" href="#" target="_blank">新标签页打开正文</a>
      <a class="btn secondary" id="backListLink" href="index.html">返回规范列表</a>
    </div>
    <iframe id="specFrame" style="display:none"></iframe>
  </main>

    <footer class="site-footer">
      <div class="footer-links" id="detailFooter"></div>
      <p>&copy; 2026 效率盒子. 价格鉴证评估技术专栏</p>
    </footer>

  <script>window.EFFBOX_STATS_API="https://api.toolshe.cn";</script>
  <script src="specs.js?v=3"></script>
  <script>
    const S = window.Specs;
    const id = new URLSearchParams(location.search).get("id");
    const from = new URLSearchParams(location.search).get("from") || "valuation";
    const backHref = from === "math" ? "../math/index.html" : "index.html";
    const colLabel = from === "math" ? "数学专栏" : "规范专栏";
    const frame = document.getElementById("specFrame");
    const loading = document.getElementById("detailLoading");
    const errorBox = document.getElementById("detailError");
    const debugBox = document.getElementById("debugInfo");
    const fallbackPanel = document.getElementById("fallbackPanel");
    const openNewTabBtn = document.getElementById("openNewTabBtn");
    const VERSION = "2026-08-13e";
    const API_BASE = window.EFFBOX_STATS_API || "https://api.toolshe.cn";

    function showError(msg, withLogin) {
      loading.style.display = "none";
      errorBox.style.display = "block";
      errorBox.innerHTML = msg + (withLogin
        ? ' <a href="login.html?redirect=' + encodeURIComponent(location.pathname + location.search) + '">去登录</a>'
        : "");
    }
    function showDebug(info) {
      debugBox.style.display = "block";
      debugBox.textContent = typeof info === "string" ? info : JSON.stringify(info, null, 2);
    }

    // 登录态
    try { S.renderAuthBar("authBar"); } catch (e) { console.error("[detail] renderAuthBar error", e); }

    // 根据 from 参数设置导航/返回链接/标题
    try {
      const navUl = document.getElementById("detailNav");
      if (navUl) navUl.innerHTML =
        '<li><a href="../index.html">首页</a></li>' +
        '<li><a href="' + backHref + '" class="active">' + colLabel + '</a></li>';
      const foot = document.getElementById("detailFooter");
      if (foot) foot.innerHTML =
        '<a href="../index.html">首页</a><a href="' + backHref + '">' + colLabel + '</a>';
      const backLink = document.getElementById("backListLink");
      if (backLink) backLink.setAttribute("href", backHref);
      if (from === "math") document.title = "详情 - 高中数学学习专栏";
    } catch (e) { console.error("[detail] nav setup error", e); }

    // 自适应 iframe 高度 + 调试错误
    window.addEventListener("message", (e) => {
      if (e.data && e.data.__specsH) {
        frame.style.height = Math.max(600, e.data.__specsH + 20) + "px";
      }
      if (e.data && e.data.__specsErr) {
        console.error("[detail] iframe error:", e.data.__specsErr);
        showDebug({ version: VERSION, iframe_error: e.data.__specsErr });
      }
    });

    // ── 本地嵌入降级方案（仅在直连端点失败时使用）──
    function injectIframeCompat(html) {
      const shim = "<scr" + "ipt>(function(){try{localStorage.getItem('__specs_test__');}catch(e){var mem={};try{Object.defineProperty(window,'localStorage',{value:{getItem:function(k){return mem.hasOwnProperty(k)?mem[k]:null;},setItem:function(k,v){mem[k]=String(v);},removeItem:function(k){delete mem[k];},clear:function(){mem={};}},configurable:true});}catch(x){}}if(!window.speechSynthesis){window.speechSynthesis={speak:function(){},cancel:function(){},pause:function(){},resume:function(){},getVoices:function(){return[];},pending:false,speaking:false,paused:false};}window.addEventListener('error',function(ev){try{window.parent.postMessage({__specsErr:{msg:ev.message,file:ev.filename,line:ev.lineno,col:ev.colno}},'*');}catch(x){}});})();</scr" + "ipt>";
      const headEnd = html.search(/<\/head>/i);
      if (headEnd !== -1) return html.slice(0, headEnd) + shim + html.slice(headEnd);
      const m = html.match(/<body[^>]*>/i);
      if (m) { const i = html.indexOf(m[0]) + m[0].length; return html.slice(0, i) + shim + html.slice(i); }
      return shim + html;
    }
    function injectAutoHeight(html) {
      const autoHeight = "<scr" + "ipt>window.addEventListener('load',function(){parent.postMessage({__specsH:document.body.scrollHeight},'*');});window.addEventListener('resize',function(){parent.postMessage({__specsH:document.body.scrollHeight},'*');});</scr" + "ipt>";
      const bodyEnd = html.search(/<\/body>/i);
      if (bodyEnd !== -1) return html.slice(0, bodyEnd) + autoHeight + html.slice(bodyEnd);
      return html + autoHeight;
    }
    function prepareHtml(html) { return injectAutoHeight(injectIframeCompat(html)); }

    function renderByBlob(html) {
      const blobUrl = URL.createObjectURL(
        new Blob([prepareHtml(html)], { type: "text/html; charset=utf-8" })
      );
      frame.onload = function () {
        try { frame.style.height = Math.max(600, (frame.contentDocument || frame.contentWindow.document).body.scrollHeight + 20) + "px"; } catch (e) {}
      };
      frame.src = blobUrl;
      frame.style.display = "block";
    }
    function renderByWrite(html) {
      const doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
      if (!doc || !doc.open) throw new Error("无法获取 iframe document");
      frame.style.display = "block";
      doc.open();
      doc.write(prepareHtml(html));
      doc.close();
    }
    function renderBySrcdoc(html) {
      frame.onload = function () {
        try { frame.style.height = Math.max(600, (frame.contentDocument || frame.contentWindow.document).body.scrollHeight + 20) + "px"; } catch (e) {}
      };
      frame.srcdoc = prepareHtml(html);
      frame.style.display = "block";
    }

    async function fallbackEmbed(token) {
      let j, r;
      try {
        r = await S.authFetch("/specs/get?id=" + encodeURIComponent(id));
        j = await r.json();
      } catch (e) {
        showError("内容加载失败：" + (e && e.message ? e.message : "网络错误"));
        showDebug({ version: VERSION, step: "fallback fetch", error: e && e.message });
        showFallback();
        return;
      }
      if (!r.ok || !j.ok) {
        showError(j.msg || ("接口异常 (HTTP " + r.status + ")"), r.status === 401);
        showDebug({ version: VERSION, step: "fallback api", status: r.status, response: j });
        return;
      }
      const html = (j.spec && j.spec.content_html) || "";
      if (!html.trim()) { showError("该规范暂无正文内容，请联系管理员。"); return; }
      const methods = [
        { name: "blob", fn: renderByBlob },
        { name: "document.write", fn: renderByWrite },
        { name: "srcdoc", fn: renderBySrcdoc }
      ];
      let lastErr = null;
      for (const m of methods) {
        try { m.fn(html); loading.style.display = "none"; return; } catch (e) { lastErr = e; console.error("[detail] fallback " + m.name + " failed", e); }
      }
      showError("内容渲染失败，请尝试刷新页面。");
      showDebug({ version: VERSION, content_len: html.length, last_error: lastErr && lastErr.message });
      showFallback();
    }

    function showFallback() {
      loading.style.display = "none";
      fallbackPanel.style.display = "block";
    }

    (async function () {
      try {
        const tk = S.getToken();
        if (!tk) {
          location.href = "login.html?redirect=" + encodeURIComponent(location.pathname + location.search);
          return;
        }
        if (!id) { loading.textContent = "缺少规范 id"; return; }

        // 主方案：iframe 直连后端 /specs/view 端点（后端已注入 shim 和高度脚本）
        const viewUrl = API_BASE + "/specs/view?id=" + encodeURIComponent(id) + "&token=" + encodeURIComponent(tk);
        let fallbackTimer = setTimeout(function () { fallbackEmbed(tk); }, 12000);
        frame.onload = function () {
          clearTimeout(fallbackTimer);
          loading.style.display = "none";
          frame.style.display = "block";
        };
        frame.onerror = function () {
          clearTimeout(fallbackTimer);
          console.warn("[detail] iframe 加载失败，回退本地嵌入");
          fallbackEmbed(tk);
        };
        frame.src = viewUrl;
        frame.style.display = "block";
      } catch (e) {
        console.error("[detail] unexpected error", e);
        showError("页面初始化失败：" + (e && e.message ? e.message : "未知错误"));
        showDebug({ version: VERSION, step: "top", error: e && e.message });
      }
    })();
  </script>
</body>
</html>
