            <div class="age-item"><div class="label">距下次生日</div><div class="value" id="nextBirthday">--</div></div>

  <script>
    renderRelatedTools("related-tools", "age-calculator");

    const today = new Date();
    document.getElementById('targetDate').value = today.toISOString().split('T')[0];

    const ZODIAC = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
    const CONSTELLATIONS = [
      { name:'摩羯座', start:[12,22], end:[1,19] },
      { name:'水瓶座', start:[1,20], end:[2,18] },
      { name:'双鱼座', start:[2,19], end:[3,20] },
      { name:'白羊座', start:[3,21], end:[4,19] },
      { name:'金牛座', start:[4,20], end:[5,20] },
      { name:'双子座', start:[5,21], end:[6,21] },
      { name:'巨蟹座', start:[6,22], end:[7,22] },
      { name:'狮子座', start:[7,23], end:[8,22] },
      { name:'处女座', start:[8,23], end:[9,22] },
      { name:'天秤座', start:[9,23], end:[10,23] },
      { name:'天蝎座', start:[10,24], end:[11,22] },
      { name:'射手座', start:[11,23], end:[12,21] }
    ];

    function getConstellation(month, day) {
      for (const c of CONSTELLATIONS) {
        const [sm, sd] = c.start;
        const [em, ed] = c.end;
        if (sm === 12) {
          if ((month === 12 && day >= sd) || (month === 1 && day <= ed)) return c.name;
        } else {
          if ((month === sm && day >= sd) || (month === em && day <= ed)) return c.name;
        }
      }
      return '未知';
    }

    function getGeneration(year) {
      if (year >= 2010) return '10后';
      if (year >= 2000) return '00后';
      if (year >= 1990) return '90后';
      if (year >= 1980) return '80后';
      if (year >= 1970) return '70后';
      if (year >= 1960) return '60后';
      return year + '年代';
    }

    function calcAge() {
      const birth = new Date(document.getElementById('birthDate').value);
      const target = new Date(document.getElementById('targetDate').value);
      if (isNaN(birth) || isNaN(target)) { alert('请选择有效日期'); return; }
      if (birth > target) { alert('出生日期不能晚于目标日期'); return; }

      let years = target.getFullYear() - birth.getFullYear();
      let months = target.getMonth() - birth.getMonth();
      let days = target.getDate() - birth.getDate();
      if (days < 0) { months--; days += new Date(target.getFullYear(), target.getMonth(), 0).getDate(); }
      if (months < 0) { years--; months += 12; }

      const totalMs = target - birth;
      const totalDays = Math.floor(totalMs / 86400000);
      const totalHours = Math.floor(totalMs / 3600000);

      // 下次生日
      let nextBday = new Date(target.getFullYear(), birth.getMonth(), birth.getDate());
      if (nextBday < target) nextBday = new Date(target.getFullYear() + 1, birth.getMonth(), birth.getDate());
      const daysToBday = Math.ceil((nextBday - target) / 86400000);

      const zodiac = ZODIAC[(birth.getFullYear() - 4) % 12];
      const constellation = getConstellation(birth.getMonth() + 1, birth.getDate());
      const generation = getGeneration(birth.getFullYear());

      document.getElementById('ageText').textContent = `${years}岁${months}个月${days}天`;
      document.getElementById('totalDays').textContent = totalDays.toLocaleString() + '天';
      document.getElementById('totalHours').textContent = totalHours.toLocaleString() + '时';
      document.getElementById('nextBirthday').textContent = daysToBday + '天';

      document.getElementById('tagsArea').innerHTML = `
        <span class="age-tag tag-zodiac">生肖：${zodiac}</span>
        <span class="age-tag tag-constellation">星座：${constellation}</span>
        <span class="age-tag tag-generation">${generation}</span>
      `;
      document.getElementById('resultArea').style.display = 'block';
    }
  </script>
