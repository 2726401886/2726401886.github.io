<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>密码生成器 - 在线随机安全密码生成 | 效率盒子</title>
  <meta name="description" content="免费在线密码生成器，可自定义密码长度、字符类型（大小写字母、数字、特殊符号），一键生成高强度安全随机密码。">
  <meta name="keywords" content="密码生成器,随机密码,安全密码,密码生成,强密码生成">
  <meta property="og:title" content="密码生成器 - 在线随机安全密码生成">
  <meta property="og:description" content="生成高强度随机密码，支持自定义长度和字符类型。">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="../index.html" class="logo">
        <span class="logo-icon">E</span>
        <span>效率盒子</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="../index.html">首页</a></li>
          <li><a href="../index.html#tools">工具</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="tool-header">
      <h1>密码生成器</h1>
      <p>生成高强度随机密码，支持自定义长度和字符类型</p>
    </div>

    <div class="tool-box">
      <div class="form-group">
        <label for="pw-length">密码长度 <span class="range-value" id="length-value">16</span></label>
        <input type="range" id="pw-length" min="4" max="64" value="16">
      </div>

      <div class="form-group">
        <label>字符类型</label>
        <div class="checkbox-group">
          <label class="checkbox-item">
            <input type="checkbox" id="use-upper" checked> 大写字母 (A-Z)
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="use-lower" checked> 小写字母 (a-z)
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="use-number" checked> 数字 (0-9)
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="use-symbol" checked> 特殊符号 (!@#$...)
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="pw-result">生成结果</label>
        <div style="display: flex; gap: 12px;">
          <input type="text" id="pw-result" readonly placeholder="点击下方按钮生成密码" style="font-family: 'SF Mono', 'Consolas', monospace; font-size: 16px;">
          <button class="btn btn-secondary btn-sm" onclick="copyPassword()" id="copy-btn">复制</button>
        </div>
      </div>

      <button class="btn btn-primary btn-block" onclick="generatePassword()">生成密码</button>

      <div style="margin-top: 20px;">
        <label>密码强度</label>
        <div style="display: flex; gap: 4px; margin-top: 8px;">
          <div id="strength-bar" style="flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden;">
            <div id="strength-fill" style="height: 100%; width: 0; border-radius: 4px; transition: all 0.3s ease;"></div>
          </div>
          <span id="strength-text" style="font-size: 13px; font-weight: 600; min-width: 50px; text-align: right; color: var(--text-light);">--</span>
        </div>
      </div>
    </div>

    <div class="ad-zone">
      <span class="ad-zone-label">广告位</span>
    </div>

    <div class="related-tools">
      <h2>其他工具</h2>
      <div class="related-grid" id="related-tools"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="../index.html">首页</a>
      <a href="../index.html#tools">全部工具</a>
    </div>
    <p>&copy; 2026 效率盒子. 中国传说</p>
    <p style="margin-top:4px;font-size:12px;opacity:0.7;">联系邮箱：<a href="mailto:2726401886@qq.com" style="color:inherit;text-decoration:none;">2726401886@qq.com</a></p>
    <p style="margin-top:6px;font-size:12px;opacity:0.7;"><span id="busuanzi_container_site_pv" style="display:none;">总访问 <span id="busuanzi_value_site_pv"></span> 次</span><span id="busuanzi_container_site_uv" style="display:none;"> · 访客 <span id="busuanzi_value_site_uv"></span> 人</span></p>
  </footer>

  <script src="../js/main.js"></script>
  <script>
    renderRelatedTools("related-tools", "password-generator");

    document.getElementById("pw-length").addEventListener("input", function() {
      document.getElementById("length-value").textContent = this.value;
    });

    const UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const LOWER = "abcdefghijklmnopqrstuvwxyz";
    const NUMBERS = "0123456789";
    const SYMBOLS = "!@#$%^&*()_+-=[]{}|;:,.<>?";

    // 使用 crypto.getRandomValues 生成密码学安全的随机数
    function secureRandom(max) {
      const array = new Uint32Array(1);
      crypto.getRandomValues(array);
      return array[0] % max;
    }

    function generatePassword() {
      const length = parseInt(document.getElementById("pw-length").value);
      let charset = "";

      if (document.getElementById("use-upper").checked) charset += UPPER;
      if (document.getElementById("use-lower").checked) charset += LOWER;
      if (document.getElementById("use-number").checked) charset += NUMBERS;
      if (document.getElementById("use-symbol").checked) charset += SYMBOLS;

      if (!charset) {
        showToast("请至少选择一种字符类型");
        return;
      }

      let password = "";
      for (let i = 0; i < length; i++) {
        password += charset[secureRandom(charset.length)];
      }

      document.getElementById("pw-result").value = password;
      updateStrength(password, charset.length);
    }

    function updateStrength(password, poolSize) {
      const entropy = password.length * Math.log2(poolSize);
      const fill = document.getElementById("strength-fill");
      const text = document.getElementById("strength-text");

      let percent, color, label;

      if (entropy < 40) {
        percent = 25; color = "#ef4444"; label = "弱";
      } else if (entropy < 60) {
        percent = 50; color = "#f59e0b"; label = "中等";
      } else if (entropy < 80) {
        percent = 75; color = "#10b981"; label = "强";
      } else {
        percent = 100; color = "#059669"; label = "极强";
      }

      fill.style.width = percent + "%";
      fill.style.background = color;
      text.textContent = label;
      text.style.color = color;
    }

    function copyPassword() {
      const pw = document.getElementById("pw-result").value;
      if (!pw) {
        showToast("请先生成密码");
        return;
      }
      copyToClipboard(pw, document.getElementById("copy-btn"));
    }

    // 初始生成一次
    generatePassword();
  </script>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
