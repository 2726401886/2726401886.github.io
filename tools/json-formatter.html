<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="../index.html" class="logo">
        <span class="logo-icon">E</span>
        <span>效率盒子</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="../index.html">首页</a></li>
          <li><a href="../index.html#tools">工具</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="tool-header">
      <h1>JSON 格式化工具</h1>
      <p>JSON美化、压缩、验证，自动检测语法错误</p>
    </div>

    <div class="tool-box">
      <div class="form-group">
        <label for="json-input">输入 JSON</label>
        <textarea id="json-input" placeholder='{"name":"效率盒子","tools":["字数统计","二维码"],"free":true}'></textarea>
      </div>

      <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;">
        <button class="btn btn-primary" onclick="formatJSON()">格式化</button>
        <button class="btn btn-secondary" onclick="minifyJSON()">压缩</button>
        <button class="btn btn-secondary" onclick="validateJSON()">验证</button>
        <button class="btn btn-secondary" onclick="clearAll()">清空</button>
      </div>

      <div class="form-group">
        <label for="json-output">输出结果</label>
        <textarea id="json-output" readonly placeholder="格式化后的JSON将显示在这里..."></textarea>
      </div>

      <button class="btn btn-success btn-sm" onclick="copyResult()" id="copy-btn">复制结果</button>
    </div>

    <div class="ad-zone">
      <span class="ad-zone-label">广告位</span>
    </div>

    <div class="related-tools">
      <h2>其他工具</h2>
      <div class="related-grid" id="related-tools"></div>

  <script src="../js/main.js"></script>
  <script>
    renderRelatedTools("related-tools", "json-formatter");

    function formatJSON() {
      const input = document.getElementById("json-input").value.trim();
      if (!input) {
        showToast("请输入JSON");
        return;
      }
      try {
        const parsed = JSON.parse(input);
        document.getElementById("json-output").value = JSON.stringify(parsed, null, 2);
        showToast("格式化成功");
      } catch (e) {
        document.getElementById("json-output").value = "JSON语法错误: " + e.message;
      }
    }

    function minifyJSON() {
      const input = document.getElementById("json-input").value.trim();
      if (!input) {
        showToast("请输入JSON");
        return;
      }
      try {
        const parsed = JSON.parse(input);
        document.getElementById("json-output").value = JSON.stringify(parsed);
        showToast("压缩成功");
      } catch (e) {
        document.getElementById("json-output").value = "JSON语法错误: " + e.message;
      }
    }

    function validateJSON() {
      const input = document.getElementById("json-input").value.trim();
      if (!input) {
        showToast("请输入JSON");
        return;
      }
      try {
        JSON.parse(input);
        showToast("JSON格式正确");
      } catch (e) {
        showToast("JSON格式错误: " + e.message);
      }
    }

    function clearAll() {
      document.getElementById("json-input").value = "";
      document.getElementById("json-output").value = "";
    }

    function copyResult() {
      const output = document.getElementById("json-output").value;
      if (!output || output.startsWith("JSON语法错误")) {
        showToast("没有可复制的结果");
        return;
      }
      copyToClipboard(output, document.getElementById("copy-btn"));
    }
  </script>
