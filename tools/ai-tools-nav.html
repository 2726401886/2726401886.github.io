const navEl = document.getElementById('catNav');
const mobileNavEl = document.getElementById('mobileNav');
const sectionsEl = document.getElementById('sections');
const searchInput = document.getElementById('searchInput');
const emptyState = document.getElementById('emptyState');
const statTotal = document.getElementById('statTotal');
const backTop = document.getElementById('backTop');

let totalTools = 0;

function init(){
  // 渲染左侧导航与移动端导航
  let navHtml = '';
  let mobileHtml = '';
  let sectionsHtml = '';
  cats.forEach(cat=>{
    totalTools += cat.items.length;
    navHtml += `<a href="#${cat.slug}" data-target="${cat.slug}"><span class="emoji">${cat.emoji}</span><span>${cat.name.replace('AI','')}</span><span class="cnt">${cat.items.length}</span></a>`;
    mobileHtml += `<a href="#${cat.slug}" data-target="${cat.slug}"><span>${cat.emoji}</span><span>${cat.name}</span></a>`;
    sectionsHtml += `
      <section class="at-section" id="${cat.slug}" data-name="${cat.name}">
        <div class="at-section-h"><span class="emoji">${cat.emoji}</span><h2>${cat.name}</h2><span class="cnt">${cat.items.length} 款</span></div>
        <div class="at-grid">${cat.items.map(item=>cardHtml(item, cat.tag)).join('')}</div>
      </section>`;
  });
  navEl.innerHTML = navHtml;
  mobileNavEl.innerHTML = mobileHtml;
  sectionsEl.innerHTML = sectionsHtml;
  statTotal.textContent = totalTools;

  bindSearch();
  bindScrollSpy();
  bindBackTop();
  bindCardClick();
}

function cardHtml(item, tag){
  const icon = item.name.charAt(0);
  return `<article class="at-card" data-url="${item.url}" data-key="${(item.name+' '+item.desc).toLowerCase()}" title="访问 ${item.name}">
    <div class="at-icon">${icon}</div>
    <h3 class="at-name">${escapeHtml(item.name)}</h3>
    <p class="at-desc">${escapeHtml(item.desc)}</p>
    <span class="at-tag">${tag}</span>
  </article>`;
}

function escapeHtml(text){
  const div = document.createElement('div'); div.textContent = text; return div.innerHTML;
}

function bindSearch(){
  searchInput.addEventListener('input', ()=>{
    const q = searchInput.value.trim().toLowerCase();
    let visibleCount = 0;
    document.querySelectorAll('.at-section').forEach(sec=>{
      let secVisible = 0;
      sec.querySelectorAll('.at-card').forEach(card=>{
        const match = !q || card.dataset.key.includes(q);
        card.style.display = match ? '' : 'none';
        if(match){ secVisible++; visibleCount++; }
      });
      sec.style.display = secVisible ? '' : 'none';
      const cnt = sec.querySelector('.cnt');
      if(cnt){ cnt.textContent = secVisible + ' 款'; }
    });
    emptyState.style.display = visibleCount ? 'none' : 'block';
  });
}

function bindScrollSpy(){
  const links = document.querySelectorAll('#catNav a, #mobileNav a');
  const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        links.forEach(a=>a.classList.toggle('active', a.dataset.target===entry.target.id));
      }
    });
  }, {rootMargin:'-40% 0px -55% 0px', threshold:0});
  document.querySelectorAll('.at-section').forEach(sec=>observer.observe(sec));

  document.querySelectorAll('#catNav a, #mobileNav a').forEach(a=>{
    a.addEventListener('click', e=>{
      e.preventDefault();
      const target = document.getElementById(a.dataset.target);
      if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

function bindBackTop(){
  window.addEventListener('scroll', ()=>{
    backTop.classList.toggle('show', window.scrollY > 500);
  });
  backTop.addEventListener('click', ()=>window.scrollTo({top:0, behavior:'smooth'}));
}

function bindCardClick(){
  sectionsEl.addEventListener('click', e=>{
    const card = e.target.closest('.at-card');
    if(card && card.dataset.url) window.open(card.dataset.url, '_blank', 'noopener,noreferrer');
  });
}

init();
