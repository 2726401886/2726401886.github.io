        <label>数量 <input type="number" id="count" value="5" min="1" max="100"></label>

  <script>
    renderRelatedTools("related-tools", "uuid-generator");

    function uuidv4() {
      if (crypto && crypto.randomUUID) return crypto.randomUUID();
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0;
        const v = c === "x" ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function formatUUID(uuid) {
      let result = uuid;
      if (document.getElementById("noDash").checked) {
        result = result.replace(/-/g, "");
      }
      if (document.getElementById("upper").checked) {
        result = result.toUpperCase();
      }
      return result;
    }

    function generate() {
      const count = Math.min(100, Math.max(1, parseInt(document.getElementById("count").value) || 5));
      const list = document.getElementById("uuidList");
      list.innerHTML = "";
      for (let i = 0; i < count; i++) {
        const uuid = formatUUID(uuidv4());
        const item = document.createElement("div");
        item.className = "uuid-item";
        item.innerHTML = `<span class="uuid-text">${uuid}</span><button class="uuid-copy" onclick="copyUUID('${uuid}', this)">复制</button>`;
        list.appendChild(item);
      }
    }

    function regenerate() {
      if (document.getElementById("uuidList").children.length > 0) generate();
    }

    function copyUUID(uuid, btn) {
      navigator.clipboard.writeText(uuid).then(() => {
        btn.textContent = "已复制 ✓";
        setTimeout(() => btn.textContent = "复制", 1500);
      }).catch(() => {
        const ta = document.createElement("textarea");
        ta.value = uuid;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        btn.textContent = "已复制 ✓";
        setTimeout(() => btn.textContent = "复制", 1500);
      });
    }

    generate();
  </script>
