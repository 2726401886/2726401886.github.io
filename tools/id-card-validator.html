  <script src="../js/main.js"></script>
  <script>
    renderRelatedTools("related-tools", "id-card-validator");

    // 省份代码表
    const PROVINCES = {
      11:'北京市',12:'天津市',13:'河北省',14:'山西省',15:'内蒙古自治区',
      21:'辽宁省',22:'吉林省',23:'黑龙江省',31:'上海市',32:'江苏省',
      33:'浙江省',34:'安徽省',35:'福建省',36:'江西省',37:'山东省',
      41:'河南省',42:'湖北省',43:'湖南省',44:'广东省',45:'广西壮族自治区',
      46:'海南省',50:'重庆市',51:'四川省',52:'贵州省',53:'云南省',
      54:'西藏自治区',61:'陕西省',62:'甘肃省',63:'青海省',64:'宁夏回族自治区',
      65:'新疆维吾尔自治区',71:'台湾省',81:'香港特别行政区',82:'澳门特别行政区'
    };

    function validateId() {
      const id = document.getElementById('idNumber').value.trim().toUpperCase();
      if (!id) { alert('请输入身份证号码'); return; }

      let isValid = false;
      let info = {};

      if (id.length === 18) {
        // 18位校验
        const regex = /^\d{17}[\dX]$/;
        if (!regex.test(id)) { showInvalid('格式错误：18位身份证应为17位数字+1位数字或X'); return; }

        // 省份
        const provCode = id.substring(0, 2);
        info.province = PROVINCES[provCode] || '未知地区';

        // 出生日期
        const year = parseInt(id.substring(6, 10));
        const month = parseInt(id.substring(10, 12));
        const day = parseInt(id.substring(12, 14));
        const birthDate = new Date(year, month - 1, day);
        if (birthDate.getFullYear() !== year || birthDate.getMonth() !== month - 1 || birthDate.getDate() !== day) {
          showInvalid('出生日期无效'); return;
        }
        info.birthday = `${year}年${month}月${day}日`;
        info.age = calcAge(birthDate);

        // 性别
        const genderNum = parseInt(id.charAt(16));
        info.gender = genderNum % 2 === 0 ? '女' : '男';

        // 校验码
        const weights = [7,9,10,5,8,4,2,1,6,3,7,9,10,5,8,4,2];
        const checkCodes = ['1','0','X','9','8','7','6','5','4','3','2'];
        let sum = 0;
        for (let i = 0; i < 17; i++) sum += parseInt(id.charAt(i)) * weights[i];
        const checkCode = checkCodes[sum % 11];
        if (checkCode !== id.charAt(17)) { showInvalid('校验码错误，身份证号码无效'); return; }

        isValid = true;
      } else if (id.length === 15) {
        const regex = /^\d{15}$/;
        if (!regex.test(id)) { showInvalid('格式错误：15位身份证应全为数字'); return; }

        const provCode = id.substring(0, 2);
        info.province = PROVINCES[provCode] || '未知地区';

        const year = 1900 + parseInt(id.substring(6, 8));
        const month = parseInt(id.substring(8, 10));
        const day = parseInt(id.substring(10, 12));
        info.birthday = `${year}年${month}月${day}日`;
        const birthDate = new Date(year, month - 1, day);
        info.age = calcAge(birthDate);

        const genderNum = parseInt(id.charAt(14));
        info.gender = genderNum % 2 === 0 ? '女' : '男';
        isValid = true;
      } else {
        showInvalid('身份证号码长度应为15位或18位'); return;
      }

      if (isValid) {
        document.getElementById('statusBar').className = 'id-status valid';
        document.getElementById('statusBar').textContent = '校验通过 - 身份证号码有效';
        document.getElementById('infoGrid').innerHTML = `
          <div class="id-info-item"><div class="label">归属省份</div><div class="value">${info.province}</div></div>
          <div class="id-info-item"><div class="label">出生日期</div><div class="value">${info.birthday}</div></div>
          <div class="id-info-item"><div class="label">性别</div><div class="value">${info.gender}</div></div>
          <div class="id-info-item"><div class="label">当前年龄</div><div class="value">${info.age}岁</div></div>
        `;
        document.getElementById('resultArea').style.display = 'block';
      }
    }

    function showInvalid(msg) {
      document.getElementById('statusBar').className = 'id-status invalid';
      document.getElementById('statusBar').textContent = '校验失败 - ' + msg;
      document.getElementById('infoGrid').innerHTML = '';
      document.getElementById('resultArea').style.display = 'block';
    }

    function calcAge(birth) {
      const now = new Date();
      let age = now.getFullYear() - birth.getFullYear();
      if (now.getMonth() < birth.getMonth() || (now.getMonth() === birth.getMonth() && now.getDate() < birth.getDate())) age--;
      return age;
    }
  </script>
