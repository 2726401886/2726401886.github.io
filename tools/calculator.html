  <style>
    .calc-display{background:#1e293b;color:#fff;padding:16px 20px;border-radius:8px;font-size:28px;text-align:right;min-height:64px;display:flex;align-items:center;justify-content:flex-end;word-break:break-all;margin-bottom:16px;font-family:"Courier New",monospace}

    .calc-key:hover{background:#e2e8f0}

    .calc-key.op{background:#eef2ff;color:#4f46e5}
    .calc-key.op:hover{background:#e0e7ff}
    .calc-key.eq{background:#4f46e5;color:#fff}
    .calc-key.eq:hover{background:#4338ca}
    .calc-key.fn{background:#fef3c7;color:#92400e;font-size:14px}
    .calc-key.fn:hover{background:#fde68a}
    .calc-key.clear{background:#fee2e2;color:#dc2626}
    .calc-key.clear:hover{background:#fecaca}
    .calc-key.wide{grid-column:span 2}
  </style>
</head>
<body>

      <a href="../index.html" class="logo"><span class="logo-icon">E</span><span>效率盒子</span></a>

  <main class="main-content">
    <div class="tool-header">
      <h1>在线计算器</h1>
      <p>科学计算器，支持复杂表达式运算</p>
    </div>

    <div class="tool-box" style="max-width:420px;margin:0 auto">
      <div class="calc-display" id="display">0</div>
      <div class="calc-keys">
        <button class="calc-key clear" onclick="clearAll()">AC</button>
        <button class="calc-key fn" onclick="backspace()">⌫</button>
        <button class="calc-key fn" onclick="appendValue('%')">%</button>
        <button class="calc-key op" onclick="appendValue('/')">÷</button>

        <button class="calc-key" onclick="appendValue('7')">7</button>
        <button class="calc-key" onclick="appendValue('8')">8</button>
        <button class="calc-key" onclick="appendValue('9')">9</button>
        <button class="calc-key op" onclick="appendValue('*')">×</button>

        <button class="calc-key" onclick="appendValue('4')">4</button>
        <button class="calc-key" onclick="appendValue('5')">5</button>
        <button class="calc-key" onclick="appendValue('6')">6</button>
        <button class="calc-key op" onclick="appendValue('-')">−</button>

        <button class="calc-key" onclick="appendValue('1')">1</button>
        <button class="calc-key" onclick="appendValue('2')">2</button>
        <button class="calc-key" onclick="appendValue('3')">3</button>
        <button class="calc-key op" onclick="appendValue('+')">+</button>

        <button class="calc-key" onclick="appendValue('0')">0</button>
        <button class="calc-key" onclick="appendValue('.')">.</button>
        <button class="calc-key fn" onclick="appendValue('Math.sqrt(')">√</button>
        <button class="calc-key fn" onclick="appendValue('Math.pow(')">x^y</button>

        <button class="calc-key fn" onclick="appendValue('(')">(</button>
        <button class="calc-key fn" onclick="appendValue(')')">)</button>
        <button class="calc-key fn" onclick="appendValue('Math.PI')">π</button>
        <button class="calc-key eq" onclick="calculate()">=</button>
      </div>
    </div>

    <div class="ad-zone"><span class="ad-zone-label">广告位</span></div>

    <div class="related-tools">
      <h2>其他工具</h2>
      <div class="related-grid" id="related-tools"></div>
    </div>
  </main>

    <p style="margin-top:6px;font-size:12px;opacity:0.7;"><span id="busuanzi_container_site_pv" style="display:none;">总访问 <span id="busuanzi_value_site_pv"></span> 次</span><span id="busuanzi_container_site_uv" style="display:none;"> · 访客 <span id="busuanzi_value_site_uv"></span> 人</span></p>

  <script src="../js/main.js"></script>
  <script>
    renderRelatedTools("related-tools", "calculator");
    let expression = "";
    const display = document.getElementById("display");

    function appendValue(val) {
      expression += val;
      display.textContent = expression;
    }

    function clearAll() {
      expression = "";
      display.textContent = "0";
    }

    function backspace() {
      expression = expression.slice(0, -1);
      display.textContent = expression || "0";
    }

    function calculate() {
      try {
        const result = eval(expression);
        if (result === undefined || result === null || isNaN(result)) {
          display.textContent = "Error";
          expression = "";
          return;
        }
        display.textContent = result;
        expression = String(result);
      } catch (e) {
        display.textContent = "Error";
        expression = "";
      }
    }

    document.addEventListener("keydown", (e) => {
      if (/[0-9+\-*/.()%]/.test(e.key)) appendValue(e.key);
      else if (e.key === "Enter" || e.key === "=") calculate();
      else if (e.key === "Backspace") backspace();
      else if (e.key === "Escape") clearAll();
    });
  </script>
