  <meta name="keywords" content="文本对比,文本差异比较,在线文本对比,代码对比,文本diff,文档比较">
  <meta property="og:title" content="文本对比 - 在线文本差异比较工具">

  <link rel="stylesheet" href="../css/style.css">
  <style>
    .diff-container{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
    @media(max-width:640px){.diff-container{grid-template-columns:1fr}}
    .diff-input{width:100%;min-height:200px;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:monospace;font-size:14px;resize:vertical}
    .diff-result{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:20px}
    .diff-line{display:flex;font-family:monospace;font-size:14px;line-height:1.6}
    .diff-line .line-num{width:40px;flex-shrink:0;text-align:right;padding:0 10px;color:var(--text-lighter);background:#f1f5f9;border-right:1px solid var(--border);user-select:none}
    .diff-line .line-content{padding:0 12px;flex:1;white-space:pre-wrap;word-break:break-all}
    .diff-line.added{background:#d1fae5}
    .diff-line.added .line-content{color:#065f46}
    .diff-line.removed{background:#fee2e2}
    .diff-line.removed .line-content{color:#991b1b}
    .diff-line.same .line-content{color:var(--text-light)}
    .diff-line.empty{background:#f8fafc}
    .diff-side-label{font-size:13px;font-weight:600;color:var(--text-light);margin-bottom:6px}
    .diff-summary{display:flex;gap:16px;margin-bottom:12px;font-size:14px}
    .diff-summary .added-count{color:#059669;font-weight:600}
    .diff-summary .removed-count{color:#dc2626;font-weight:600}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="../index.html" class="logo"><span class="logo-icon">E</span><span>效率盒子</span></a>
      <nav><ul class="nav-links"><li><a href="../index.html">首页</a></li><li><a href="../index.html#tools">工具</a></li></ul></nav>
    </div>
  </header>

  <main class="main-content">
    <div class="tool-header">
      <h1>文本对比</h1>
      <p>逐行比较两段文本的差异，高亮显示不同之处</p>
    </div>

    <div class="tool-box">
      <div class="diff-container">
        <div>
          <div class="diff-side-label">原始文本</div>
          <textarea class="diff-input" id="text1" placeholder="在此粘贴原始文本..."></textarea>
        </div>
        <div>
          <div class="diff-side-label">修改后文本</div>
          <textarea class="diff-input" id="text2" placeholder="在此粘贴修改后的文本..."></textarea>
        </div>
      </div>

      <div style="display:flex;gap:12px;margin-bottom:20px">
        <button class="btn btn-primary" onclick="compare()">对比差异</button>
        <button class="btn btn-secondary" onclick="clearAll()">清空</button>
        <button class="btn btn-secondary" onclick="swap()">交换 ↔</button>
      </div>

      <div class="diff-summary" id="summary" style="display:none">
        <span>共 <strong id="total-lines">0</strong> 行</span>
        <span class="added-count">+ 新增 <strong id="added-count">0</strong> 行</span>
        <span class="removed-count">- 删除 <strong id="removed-count">0</strong> 行</span>
      </div>

      <div class="diff-result" id="result"></div>
    </div>

    <div class="ad-zone"><span class="ad-zone-label">广告位</span></div>

    <div class="related-tools">
      <h2>其他工具</h2>
      <div class="related-grid" id="related-tools"></div>
    </div>
  </main>

  <script src="../js/main.js"></script>
  <script>
    renderRelatedTools("related-tools", "text-diff");

    function compare() {
      const t1 = document.getElementById("text1").value.split("\n");
      const t2 = document.getElementById("text2").value.split("\n");

      if (t1.length === 1 && t1[0] === "" && t2.length === 1 && t2[0] === "") {
        showToast("请输入文本");
        return;
      }

      // LCS diff algorithm
      const m = t1.length, n = t2.length;
      const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          if (t1[i - 1] === t2[j - 1]) dp[i][j] = dp[i - 1][j - 1] + 1;
          else dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
        }
      }

      const lines = [];
      let i = m, j = n;
      while (i > 0 && j > 0) {
        if (t1[i - 1] === t2[j - 1]) {
          lines.unshift({ type: "same", content: t1[i - 1], num1: i, num2: j });
          i--; j--;
        } else if (dp[i - 1][j] >= dp[i][j - 1]) {
          lines.unshift({ type: "removed", content: t1[i - 1], num1: i });
          i--;
        } else {
          lines.unshift({ type: "added", content: t2[j - 1], num2: j });
          j--;
        }
      }
      while (i > 0) { lines.unshift({ type: "removed", content: t1[i - 1], num1: i }); i--; }
      while (j > 0) { lines.unshift({ type: "added", content: t2[j - 1], num2: j }); j--; }

      // Render
      let html = "";
      let addedCount = 0, removedCount = 0;
      lines.forEach(line => {
        const num1 = line.num1 || "";
        const num2 = line.num2 || "";
        let typeClass = line.type;
        if (line.type === "added") addedCount++;
        if (line.type === "removed") removedCount++;
        html += `<div class="diff-line ${typeClass}"><span class="line-num">${num1 || "&nbsp;"}</span><span class="line-num">${num2 || "&nbsp;"}</span><span class="line-content">${escapeHtml(line.content) || "&nbsp;"}</span></div>`;
      });

      document.getElementById("result").innerHTML = html;
      document.getElementById("summary").style.display = "flex";
      document.getElementById("total-lines").textContent = lines.length;
      document.getElementById("added-count").textContent = addedCount;
      document.getElementById("removed-count").textContent = removedCount;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function clearAll() {
      document.getElementById("text1").value = "";
      document.getElementById("text2").value = "";
      document.getElementById("result").innerHTML = "";
      document.getElementById("summary").style.display = "none";
    }

    function swap() {
      const t = document.getElementById("text1").value;
      document.getElementById("text1").value = document.getElementById("text2").value;
      document.getElementById("text2").value = t;
    }
  </script>
