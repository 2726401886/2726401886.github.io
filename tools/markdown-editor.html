  <script>
    renderRelatedTools("related-tools", "markdown-editor");

    function escapeHtml(s) {
      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function render() {
      let md = document.getElementById("mdInput").value;
      let html = escapeHtml(md);
      // 代码块
      html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => `<pre><code>${code.trim()}</code></pre>`);
      // 标题
      html = html.replace(/^### (.+)$/gm, "<h3>$1</h3>");
      html = html.replace(/^## (.+)$/gm, "<h2>$1</h2>");
      html = html.replace(/^# (.+)$/gm, "<h1>$1</h1>");
      // 分隔线
      html = html.replace(/^---$/gm, "<hr>");
      // 引用
      html = html.replace(/^&gt; (.+)$/gm, "<blockquote>$1</blockquote>");
      // 表格
      html = html.replace(/^\|(.+)\|\n\|[-| :]+\|\n((?:\|.*\|\n?)*)/gm, (m, header, rows) => {
        const hCells = header.split("|").map(c => c.trim()).filter(c => c);
        const rCells = rows.trim().split("\n").map(r => r.split("|").map(c => c.trim()).filter(c => c));
        let table = "<table><thead><tr>" + hCells.map(c => `<th>${c}</th>`).join("") + "</tr></thead><tbody>";
        rCells.forEach(r => { table += "<tr>" + r.map(c => `<td>${c}</td>`).join("") + "</tr>"; });
        return table + "</tbody></table>";
      });
      // 列表
      html = html.replace(/^- (.+)$/gm, "<li>$1</li>");
      html = html.replace(/(<li>.*<\/li>\n?)+/g, m => "<ul>" + m + "</ul>");
      html = html.replace(/^\d+\. (.+)$/gm, "<li>$1</li>");
      // 行内代码
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
      // 粗体斜体
      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      // 链接
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
      // 段落
      html = html.split(/\n\n+/).map(block => {
        if (block.match(/^<(h\d|ul|ol|pre|blockquote|table|hr)/)) return block;
        return block.trim() ? "<p>" + block.replace(/\n/g, "<br>") + "</p>" : "";
      }).join("\n");
      document.getElementById("mdPreview").innerHTML = html;
    }

    function insert(before, after, placeholder) {
      const ta = document.getElementById("mdInput");
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      const sel = ta.value.substring(start, end) || placeholder;
      ta.value = ta.value.substring(0, start) + before + sel + after + ta.value.substring(end);
      ta.focus();
      render();
    }

    function insertLine(prefix) {
      const ta = document.getElementById("mdInput");
      const start = ta.selectionStart;
      const lineStart = ta.value.lastIndexOf("\n", start - 1) + 1;
      ta.value = ta.value.substring(0, lineStart) + prefix + "\n" + ta.value.substring(lineStart);
      ta.focus();
      render();
    }

    function copyHTML() {
      const html = document.getElementById("mdPreview").innerHTML;
      navigator.clipboard.writeText(html).then(() => {
        alert("HTML代码已复制到剪贴板！");
      }).catch(() => {
        const ta = document.createElement("textarea");
        ta.value = html;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        alert("HTML代码已复制！");
      });
    }

    render();
  </script>
