  <script>
    renderRelatedTools("related-tools", "color-converter");

    const picker = document.getElementById("color-picker");
    const hexInput = document.getElementById("hex-input");
    const rgbInput = document.getElementById("rgb-input");
    const hslInput = document.getElementById("hsl-input");
    const preview = document.getElementById("color-preview");

    function hexToRgb(hex) {
      hex = hex.replace("#", "");
      if (hex.length === 3) hex = hex.split("").map(c => c + c).join("");
      const r = parseInt(hex.substr(0, 2), 16);
      const g = parseInt(hex.substr(2, 2), 16);
      const b = parseInt(hex.substr(4, 2), 16);
      return { r, g, b };
    }

    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(x => {
        const h = x.toString(16);
        return h.length === 1 ? "0" + h : h;
      }).join("");
    }

    function rgbToHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, l = (max + min) / 2;
      if (max === min) { h = s = 0; }
      else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
    }

    function updateAll(hex) {
      hex = hex.replace("#", "");
      if (hex.length === 3) hex = hex.split("").map(c => c + c).join("");
      if (!/^[0-9a-fA-F]{6}$/.test(hex)) return;

      const { r, g, b } = hexToRgb(hex);
      const { h, s, l } = rgbToHsl(r, g, b);

      const hexStr = "#" + hex.toLowerCase();
      const rgbStr = "rgb(" + r + ", " + g + ", " + b + ")";
      const hslStr = "hsl(" + h + ", " + s + "%, " + l + "%)";

      hexInput.value = hexStr;
      rgbInput.value = rgbStr;
      hslInput.value = hslStr;
      picker.value = hexStr;
      preview.style.background = hexStr;
    }

    picker.addEventListener("input", function() {
      updateAll(this.value);
    });

    hexInput.addEventListener("input", function() {
      let val = this.value.trim();
      if (!val.startsWith("#")) val = "#" + val;
      if (/^#[0-9a-fA-F]{6}$/.test(val) || /^#[0-9a-fA-F]{3}$/.test(val)) {
        updateAll(val);
      }
    });

    rgbInput.addEventListener("input", function() {
      const m = this.value.match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
      if (m) {
        const hex = rgbToHex(parseInt(m[1]), parseInt(m[2]), parseInt(m[3]));
        updateAll(hex);
      }
    });

    function copyValue(id) {
      const val = document.getElementById(id).value;
      copyToClipboard(val);
    }

    updateAll("#4f46e5");
  </script>
