<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单位换算 - 长度/重量/温度/面积换算 | 效率盒子</title>
  <meta name="description" content="免费在线单位换算工具，支持长度、重量、温度、面积、体积、速度等多种单位互相换算。方便快捷，手机也可使用。">
  <meta name="keywords" content="单位换算,长度换算,重量换算,温度换算,面积换算,体积换算,在线单位转换">
  <meta property="og:title" content="单位换算 - 长度/重量/温度/面积换算">
  <meta property="og:description" content="多单位换算工具，支持长度重量温度等。">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .unit-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
    .unit-tab{padding:8px 18px;border:2px solid var(--border);border-radius:20px;cursor:pointer;font-size:14px;transition:all .2s;background:#fff;color:var(--text-light)}
    .unit-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .unit-row{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .unit-row input,.unit-row select{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px}
    .unit-row .arrow{font-size:20px;color:var(--text-lighter);flex-shrink:0}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="../index.html" class="logo"><span class="logo-icon">E</span><span>效率盒子</span></a>
      <nav><ul class="nav-links"><li><a href="../index.html">首页</a></li><li><a href="../index.html#tools">工具</a></li></ul></nav>
    </div>
  </header>

  <main class="main-content">
    <div class="tool-header">
      <h1>单位换算</h1>
      <p>长度、重量、温度、面积、体积、速度单位换算</p>
    </div>

    <div class="tool-box">
      <div class="unit-tabs" id="tabs">
        <div class="unit-tab active" onclick="switchCategory('length')">长度</div>
        <div class="unit-tab" onclick="switchCategory('weight')">重量</div>
        <div class="unit-tab" onclick="switchCategory('temperature')">温度</div>
        <div class="unit-tab" onclick="switchCategory('area')">面积</div>
        <div class="unit-tab" onclick="switchCategory('volume')">体积</div>
        <div class="unit-tab" onclick="switchCategory('speed')">速度</div>
      </div>

      <div class="unit-row">
        <input type="number" id="input-val" value="1" oninput="doConvert()">
        <select id="from-unit" onchange="doConvert()"></select>
        <span class="arrow">→</span>
        <select id="to-unit" onchange="doConvert()"></select>
        <input type="text" id="output-val" readonly>
      </div>
    </div>

    <div class="ad-zone"><span class="ad-zone-label">广告位</span></div>

    <div class="related-tools">
      <h2>其他工具</h2>
      <div class="related-grid" id="related-tools"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-links"><a href="../index.html">首页</a><a href="../index.html#tools">全部工具</a></div>
    <p>&copy; 2026 效率盒子. 中国传说</p>
    <p style="margin-top:4px;font-size:12px;opacity:0.7;">联系邮箱：<a href="mailto:2726401886@qq.com" style="color:inherit;text-decoration:none;">2726401886@qq.com</a></p>
    <p style="margin-top:6px;font-size:12px;opacity:0.7;"><span id="busuanzi_container_site_pv" style="display:none;">总访问 <span id="busuanzi_value_site_pv"></span> 次</span><span id="busuanzi_container_site_uv" style="display:none;"> · 访客 <span id="busuanzi_value_site_uv"></span> 人</span></p>
  </footer>

  <script src="../js/main.js"></script>
  <script>
    renderRelatedTools("related-tools", "unit-converter");

    const UNITS = {
      length: { name: "长度", units: { "毫米(mm)":0.001, "厘米(cm)":0.01, "米(m)":1, "千米(km)":1000, "英寸(in)":0.0254, "英尺(ft)":0.3048, "码(yd)":0.9144, "英里(mi)":1609.344 } },
      weight: { name: "重量", units: { "毫克(mg)":0.001, "克(g)":1, "千克(kg)":1000, "吨(t)":1000000, "盎司(oz)":28.3495, "磅(lb)":453.592 } },
      temperature: { name: "温度", units: { "摄氏度(°C)":"c", "华氏度(°F)":"f", "开尔文(K)":"k" } },
      area: { name: "面积", units: { "平方厘米(cm²)":0.0001, "平方米(m²)":1, "平方千米(km²)":1000000, "公顷(ha)":10000, "亩":666.667, "平方英寸(in²)":0.00064516, "平方英尺(ft²)":0.092903, "英亩(ac)":4046.86 } },
      volume: { name: "体积", units: { "毫升(ml)":0.001, "升(L)":1, "立方米(m³)":1000, "加仑(gal)":3.78541, "品脱(pt)":0.473176, "立方英寸(in³)":0.0163871 } },
      speed: { name: "速度", units: { "米/秒(m/s)":1, "千米/时(km/h)":0.277778, "英里/时(mph)":0.44704, "节(knot)":0.514444, "马赫(Mach)":340.29 } }
    };

    let currentCategory = "length";

    function switchCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll(".unit-tab").forEach(t => t.classList.remove("active"));
      event.target.classList.add("active");
      const units = Object.keys(UNITS[cat].units);
      const fromSel = document.getElementById("from-unit");
      const toSel = document.getElementById("to-unit");
      fromSel.innerHTML = units.map(u => `<option value="${u}">${u}</option>`).join("");
      toSel.innerHTML = units.map(u => `<option value="${u}">${u}</option>`).join("");
      if (units.length > 1) toSel.selectedIndex = 1;
      doConvert();
    }

    function doConvert() {
      const val = parseFloat(document.getElementById("input-val").value);
      if (isNaN(val)) { document.getElementById("output-val").value = ""; return; }
      const from = document.getElementById("from-unit").value;
      const to = document.getElementById("to-unit").value;
      const units = UNITS[currentCategory].units;

      let result;
      if (currentCategory === "temperature") {
        let celsius;
        if (from.includes("°C")) celsius = val;
        else if (from.includes("°F")) celsius = (val - 32) * 5 / 9;
        else if (from.includes("K")) celsius = val - 273.15;

        if (to.includes("°C")) result = celsius;
        else if (to.includes("°F")) result = celsius * 9 / 5 + 32;
        else if (to.includes("K")) result = celsius + 273.15;
      } else {
        result = val * units[from] / units[to];
      }

      document.getElementById("output-val").value = parseFloat(result.toFixed(8));
    }

    switchCategory("length");
  </script>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<script>window.EFFBOX_STATS_API="https://api.toolshe.cn";</script>
  <script src="/stats.js"></script>
</body>
</html>
