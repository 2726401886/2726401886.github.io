    .regex-pattern{display:flex;gap:8px;margin-bottom:12px}

    .regex-textarea:focus{border-color:#4f46e5;outline:none}
    .regex-output{background:#1e293b;color:#e2e8f0;padding:16px;border-radius:8px;font-family:"Courier New",monospace;font-size:14px;min-height:100px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
    .regex-output mark{background:#fbbf24;color:#1e293b;padding:1px 2px;border-radius:2px}
    .regex-stats{display:flex;gap:16px;margin:12px 0;font-size:13px;color:#64748b}

  <main class="main-content">
    <div class="tool-header">
      <h1>正则表达式测试</h1>
      <p>在线测试正则表达式，实时高亮匹配结果</p>

    <div class="tool-box">
      <label style="display:block;margin-bottom:6px;font-weight:600;color:#475569">正则表达式</label>

        <input type="text" id="pattern" placeholder="例如：\d+ 匹配数字" value="\d+" oninput="testRegex()">

      <div class="regex-flags">
        <span class="regex-flag active" data-flag="g" onclick="toggleFlag(this)">g 全局</span>
        <span class="regex-flag" data-flag="i" onclick="toggleFlag(this)">i 忽略大小写</span>
        <span class="regex-flag" data-flag="m" onclick="toggleFlag(this)">m 多行</span>
        <span class="regex-flag" data-flag="s" onclick="toggleFlag(this)">s .匹配换行</span>
      </div>

      <label style="display:block;margin-bottom:6px;font-weight:600;color:#475569">测试文本</label>
      <textarea class="regex-textarea" id="testText" oninput="testRegex()" placeholder="在此输入要测试的文本...">Hello 2026! Phone: 138-8888-9999, Code: 00742</textarea>

      <div class="regex-stats" id="stats"></div>

      <label style="display:block;margin:12px 0 6px;font-weight:600;color:#475569">匹配结果</label>
      <div class="regex-output" id="output">等待输入...</div>

  <script src="../js/main.js"></script>
  <script>
    renderRelatedTools("related-tools", "regex-tester");

    function getFlags() {
      let flags = "";
      document.querySelectorAll(".regex-flag.active").forEach(el => {
        flags += el.dataset.flag;
      });
      return flags;
    }

    function toggleFlag(el) {
      el.classList.toggle("active");
      testRegex();
    }

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function testRegex() {
      const pattern = document.getElementById("pattern").value;
      const text = document.getElementById("testText").value;
      const output = document.getElementById("output");
      const stats = document.getElementById("stats");

      if (!pattern) {
        output.textContent = "请输入正则表达式";
        stats.innerHTML = "";
        return;
      }

      try {
        const flags = getFlags();
        const regex = new RegExp(pattern, flags);
        const matches = [...text.matchAll(new RegExp(pattern, flags.includes("g") ? flags : flags + "g"))];
        
        if (matches.length === 0) {
          output.innerHTML = escapeHtml(text) + "\n\n—— 无匹配 ——";
          stats.innerHTML = `<span>匹配数：0</span>`;
          return;
        }

        let highlighted = "";
        let last = 0;
        matches.forEach(m => {
          highlighted += escapeHtml(text.slice(last, m.index));
          highlighted += `<mark>${escapeHtml(m[0])}</mark>`;
          last = m.index + m[0].length;
        });
        highlighted += escapeHtml(text.slice(last));
        output.innerHTML = highlighted;

        stats.innerHTML = `<span>匹配数：${matches.length}</span><span>标志：/${flags}/</span>`;
      } catch (e) {
        output.textContent = "正则表达式错误：" + e.message;
        stats.innerHTML = `<span style="color:#dc2626">语法错误</span>`;
      }
    }

    testRegex();
  </script>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
