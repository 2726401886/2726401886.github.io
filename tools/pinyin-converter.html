    // 带声调符号的元音
    function addToneMark(pinyin, tone) {
      if (tone === 0 || tone === 5) return pinyin;
      const toneMap = {
        'a': ['a','a','a','a'], 'e': ['e','e','e','e'], 'i': ['i','i','i','i'],
        'o': ['o','o','o','o'], 'u': ['u','u','u','u'], 'v': ['v','v','v','v']
      };
      const marks = { 'a': ['a','a','a','a'], 'e': ['e','e','e','e'], 'i': ['i','i','i','i'], 'o': ['o','o','o','o'], 'u': ['u','u','u','u'] };
      // 简化版：在韵母主要元音上加声调
      const vowels = ['a','o','e','i','u'];
      for (const v of vowels) {
        const idx = pinyin.indexOf(v);
        if (idx !== -1) {
          const toned = { 1: {'a':'a','e':'e','i':'i','o':'o','u':'u'}, 2: {'a':'a','e':'e','i':'i','o':'o','u':'u'}, 3: {'a':'a','e':'e','i':'i','o':'o','u':'u'}, 4: {'a':'a','e':'e','i':'i','o':'o','u':'u'} };
          return pinyin.substring(0, idx) + pinyin[idx] + pinyin.substring(idx + 1);
        }
      }
      return pinyin;
    }

    function convertPinyin() {
      const text = document.getElementById('inputText').value;
      if (!text.trim()) { alert('请输入汉字'); return; }

      const showTone = document.getElementById('showTone').checked;
      const vertical = document.getElementById('verticalMode').checked;
      const uppercase = document.getElementById('uppercase').checked;

      const chars = [...text];
      let resultHtml = '';
      let flatResult = '';

      for (const ch of chars) {
        if (PINYIN_MAP[ch]) {
          let py = PINYIN_MAP[ch];
          if (uppercase) py = py.charAt(0).toUpperCase() + py.slice(1);
          if (vertical) {
            resultHtml += `<span style="display:inline-block;text-align:center;margin:0 2px"><span class="py-pinyin">${py}</span><span class="py-hanzi">${ch}</span></span>`;
          } else {
            resultHtml += `<span class="py-hanzi">${ch}</span><span class="py-flat">${py} </span>`;
          }
          flatResult += py + ' ';
        } else if (ch === '\n') {
          resultHtml += '<br>';
          flatResult += '\n';
        } else if (ch === ' ') {
          resultHtml += ' ';
          flatResult += ' ';
        } else {
          resultHtml += `<span class="py-hanzi">${ch}</span>`;
          flatResult += ch;
        }
      }

      document.getElementById('resultBox').innerHTML = resultHtml;
      document.getElementById('resultBox').dataset.flat = flatResult;
      document.getElementById('resultArea').style.display = 'block';
    }

    function copyResult() {
      const text = document.getElementById('resultBox').dataset.flat || '';
      copyToClipboard(text.trim());
