<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI计算器 - 身体质量指数在线计算 | 效率盒子</title>
  <meta name="description" content="免费在线BMI计算器，输入身高体重即可计算身体质量指数(BMI)，判断是否偏瘦、正常、超重或肥胖。支持成人BMI标准。">
  <meta name="keywords" content="BMI计算器,身体质量指数,肥胖计算,体重指数,健康计算器,BMI">
  <meta property="og:title" content="BMI计算器 - 身体质量指数在线计算">
  <meta property="og:description" content="免费在线BMI计算器，快速判断体重是否健康。">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .bmi-inputs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
    .bmi-inputs label{display:block;margin-bottom:6px;font-weight:600;color:#475569;font-size:14px}
    .bmi-inputs input{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:8px;font-size:16px}
    .bmi-inputs input:focus{border-color:#4f46e5;outline:none}
    .bmi-result{background:#f8fafc;border-radius:12px;padding:24px;text-align:center;margin-bottom:20px}
    .bmi-value{font-size:48px;font-weight:700;color:#4f46e5;margin:8px 0}
    .bmi-category{font-size:20px;font-weight:600;padding:6px 16px;border-radius:20px;display:inline-block;margin-top:8px}
    .bmi-category.thin{background:#dbeafe;color:#1e40af}
    .bmi-category.normal{background:#dcfce7;color:#166534}
    .bmi-category.over{background:#fef3c7;color:#92400e}
    .bmi-category.obese{background:#fee2e2;color:#dc2626}
    .bmi-scale{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:16px 0}
    .bmi-scale div{flex:1}
    .bmi-scale-labels{display:flex;font-size:11px;color:#64748b;margin-top:4px}
    .bmi-scale-labels span{flex:1;text-align:center}
    .bmi-tip{background:#eef2ff;border-radius:8px;padding:12px 16px;font-size:13px;color:#4338ca;line-height:1.6}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="../index.html" class="logo"><span class="logo-icon">E</span><span>效率盒子</span></a>
      <nav><ul class="nav-links"><li><a href="../index.html">首页</a></li><li><a href="../index.html#tools">工具</a></li></ul></nav>
    </div>
  </header>

  <main class="main-content">
    <div class="tool-header">
      <h1>BMI计算器</h1>
      <p>输入身高体重，快速计算身体质量指数</p>
    </div>

    <div class="tool-box" style="max-width:480px;margin:0 auto">
      <div class="bmi-inputs">
        <div>
          <label>身高 (cm)</label>
          <input type="number" id="height" placeholder="例如：170" value="170">
        </div>
        <div>
          <label>体重 (kg)</label>
          <input type="number" id="weight" placeholder="例如：65" value="65">
        </div>
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="calcBMI()">计算BMI</button>

      <div class="bmi-result" id="result" style="display:none">
        <div style="font-size:14px;color:#64748b">您的BMI指数</div>
        <div class="bmi-value" id="bmiValue">--</div>
        <div class="bmi-category" id="bmiCategory">--</div>
        <div class="bmi-scale">
          <div style="background:#dbeafe"></div>
          <div style="background:#dcfce7"></div>
          <div style="background:#fef3c7"></div>
          <div style="background:#fee2e2"></div>
        </div>
        <div class="bmi-scale-labels">
          <span>&lt;18.5 偏瘦</span>
          <span>18.5-23.9 正常</span>
          <span>24-27.9 超重</span>
          <span>≥28 肥胖</span>
        </div>
        <div class="bmi-tip" id="bmiTip" style="margin-top:12px"></div>
      </div>
    </div>

    <div class="ad-zone"><span class="ad-zone-label">广告位</span></div>

    <div class="related-tools">
      <h2>其他工具</h2>
      <div class="related-grid" id="related-tools"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-links"><a href="../index.html">首页</a><a href="../index.html#tools">全部工具</a></div>
    <p>&copy; 2026 效率盒子. 中国传说</p>
    <p style="margin-top:4px;font-size:12px;opacity:0.7;">联系邮箱：<a href="mailto:2726401886@qq.com" style="color:inherit;text-decoration:none;">2726401886@qq.com</a></p>
    <p style="margin-top:6px;font-size:12px;opacity:0.7;"><span id="busuanzi_container_site_pv" style="display:none;">总访问 <span id="busuanzi_value_site_pv"></span> 次</span><span id="busuanzi_container_site_uv" style="display:none;"> · 访客 <span id="busuanzi_value_site_uv"></span> 人</span></p>
  </footer>

  <script src="../js/main.js"></script>
  <script>
    renderRelatedTools("related-tools", "bmi-calculator");

    function calcBMI() {
      const h = parseFloat(document.getElementById("height").value);
      const w = parseFloat(document.getElementById("weight").value);
      if (!h || !w || h <= 0 || w <= 0) {
        alert("请输入有效的身高和体重");
        return;
      }
      const bmi = w / Math.pow(h / 100, 2);
      const bmiFixed = bmi.toFixed(1);
      document.getElementById("bmiValue").textContent = bmiFixed;

      let category, tip;
      if (bmi < 18.5) {
        category = "偏瘦";
        tip = "建议适当增加营养摄入，保证蛋白质和碳水化合物充足。";
        setCategory("thin");
      } else if (bmi < 24) {
        category = "正常 ✓";
        tip = "体重在健康范围内，请继续保持良好的生活习惯！";
        setCategory("normal");
      } else if (bmi < 28) {
        category = "超重";
        tip = "建议控制饮食热量，每周进行3-5次有氧运动，每次30分钟以上。";
        setCategory("over");
      } else {
        category = "肥胖";
        tip = "建议咨询医生或营养师，制定科学的减重计划。";
        setCategory("obese");
      }
      document.getElementById("bmiCategory").textContent = category;
      document.getElementById("bmiTip").textContent = tip;
      document.getElementById("result").style.display = "block";
    }

    function setCategory(cls) {
      const el = document.getElementById("bmiCategory");
      el.className = "bmi-category " + cls;
    }
  </script>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
