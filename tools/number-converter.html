  <meta charset="UTF-8">

  <meta name="keywords" content="进制转换,二进制转十进制,十进制转二进制,十六进制转换,八进制转换,在线进制转换">
  <meta property="og:title" content="进制转换 - 二进制/十进制/十六进制互转">

<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="../index.html" class="logo"><span class="logo-icon">E</span><span>效率盒子</span></a>
      <nav><ul class="nav-links"><li><a href="../index.html">首页</a></li><li><a href="../index.html#tools">工具</a></li></ul></nav>
    </div>
  </header>

  <main class="main-content">
    <div class="tool-header">
      <h1>进制转换</h1>
      <p>二进制、八进制、十进制、十六进制互相转换</p>
    </div>

    <div class="tool-box">
      <div class="form-group">
        <label for="dec-input">十进制 (Decimal)</label>
        <input type="text" id="dec-input" placeholder="输入十进制数字，如 255" oninput="convert('dec')">
      </div>

      <div class="form-group">
        <label for="bin-input">二进制 (Binary)</label>
        <input type="text" id="bin-input" placeholder="如 11111111" oninput="convert('bin')">
      </div>

      <div class="form-group">
        <label for="oct-input">八进制 (Octal)</label>
        <input type="text" id="oct-input" placeholder="如 377" oninput="convert('oct')">
      </div>

      <div class="form-group">
        <label for="hex-input">十六进制 (Hexadecimal)</label>
        <input type="text" id="hex-input" placeholder="如 FF" oninput="convert('hex')">
      </div>

      <button class="btn btn-secondary btn-sm" onclick="clearAll()">清空</button>
    </div>

    <div class="ad-zone"><span class="ad-zone-label">广告位</span></div>

    <div class="related-tools">
      <h2>其他工具</h2>
      <div class="related-grid" id="related-tools"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-links"><a href="../index.html">首页</a><a href="../index.html#tools">全部工具</a></div>

    <p style="margin-top:6px;font-size:12px;opacity:0.7;"><span id="busuanzi_container_site_pv" style="display:none;">总访问 <span id="busuanzi_value_site_pv"></span> 次</span><span id="busuanzi_container_site_uv" style="display:none;"> · 访客 <span id="busuanzi_value_site_uv"></span> 人</span></p>
  </footer>

  <script src="../js/main.js"></script>
  <script>
    renderRelatedTools("related-tools", "number-converter");

    function convert(from) {
      let val = document.getElementById(from + "-input").value.trim();
      if (!val) {
        ["dec", "bin", "oct", "hex"].forEach(b => {
          if (b !== from) document.getElementById(b + "-input").value = "";
        });
        return;
      }

      let decimal;
      try {
        if (from === "dec") decimal = parseInt(val, 10);
        else if (from === "bin") decimal = parseInt(val, 2);
        else if (from === "oct") decimal = parseInt(val, 8);
        else if (from === "hex") decimal = parseInt(val, 16);

        if (isNaN(decimal)) throw new Error();
      } catch (e) {
        showToast("输入格式不正确");
        return;
      }

      if (from !== "dec") document.getElementById("dec-input").value = decimal;
      if (from !== "bin") document.getElementById("bin-input").value = decimal.toString(2);
      if (from !== "oct") document.getElementById("oct-input").value = decimal.toString(8);
      if (from !== "hex") document.getElementById("hex-input").value = decimal.toString(16).toUpperCase();
    }

    function clearAll() {
      ["dec", "bin", "oct", "hex"].forEach(b => document.getElementById(b + "-input").value = "");
    }
  </script>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
